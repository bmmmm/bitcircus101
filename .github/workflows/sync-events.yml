name: Sync calendar events

permissions:
  contents: write

on:
  schedule:
    - cron: "*/30 * * * *" # every 30 minutes
  workflow_dispatch:

concurrency:
  group: sync-events
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    # A healthy run takes 15-25s. This caps a hanging step — an ICS source that
    # accepts the connection and then stalls, or the push retry loop — so the job
    # fails with a log instead of burning the runner. Note it counts from job
    # start, not from queueing: a run that never gets a runner is not covered.
    timeout-minutes: 10
    # ICS values from Nextcloud are floating-local Europe/Berlin; pin the runner TZ
    # so date/time formatting (and UTC→local conversion) matches the calendar, not UTC.
    env:
      TZ: Europe/Berlin
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: live
          persist-credentials: true

      - name: Use scripts and config from main
        run: |
          git fetch origin main
          # jobs-core.js: build-pinnwand-feed.mjs needs it in step with the script,
          # not live's copy from the last deploy (a deploy can lag this cron).
          git checkout origin/main -- scripts/ calendars/ ics-core.js events-core.js jobs-core.js

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"

      - name: Fetch ICS and generate events JSON + RSS
        run: node scripts/sync-events.mjs

      - name: Rebuild lite page event list
        run: node scripts/build-lite-events.mjs

      # Not calendar data, but the same live-only contract and the same cadence:
      # a note whose `from` is today has to appear without waiting for a deploy.
      # jobs.json is tracked on main and the overlay copies it to live.
      - name: Rebuild the Pinnwand feed
        run: node scripts/build-pinnwand-feed.mjs

      # One static page per event (e/<id>/) plus the archive index, from
      # events-archive.json — the template is this checkout's events.html, so
      # the pages carry live's asset hashes without a cache-bust run.
      - name: Build event pages and archive
        run: node scripts/build-event-pages.mjs

      # The status page's data (/status), from the same archive — absent for
      # the same reason the archive can be, hence the guarded add below.
      - name: Build the status page data
        run: node scripts/build-status-data.mjs

      - name: Commit and push if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # -f: the feeds are .gitignored on main (rebuilt here); force-add so the
          # first run can track them on live. ical.ics + events/ copies are new (issue #1).
          # events.html: sync-events.mjs rewrites its JSON-LD block in place (#5).
          # -A on the feeds/ pathspec stages DELETIONS too — a retired tag feed
          # that syncFeedsDir removed must stop being tracked on live.
          # pinnwand/feed.xml is in the fixed list, not the guarded loop below:
          # the build step above always writes it, even for an empty wall.
          git add -f -A events-data.json feed.xml ical.ics events/feed.xml events/ical.ics feeds lite/index.html events.html pinnwand/feed.xml
          # The archive tree only exists once a primary source answered; a
          # pathspec with no match aborts git add (exit 128) and would take
          # the feed commit down with it.
          for p in events-archive.json e archiv status-data.json; do
            [ -e "$p" ] && git add -f -A -- "$p"
          done
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "Sync events from Nextcloud calendar"
          # Retry loop: pull --rebase + push (handles concurrent pushes)
          for i in 1 2 3; do
            git pull --rebase origin live && git push origin HEAD:live && exit 0
            echo "Retry $i..."
            sleep 5
          done
          echo "Push failed after 3 retries"
          exit 1
