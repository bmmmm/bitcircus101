<!doctype html>
<html lang="de">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>termine — bitcircus101</title>
        <!-- Wall-display view for the space: reachable but unlisted (like the
             invite-* stubs) — noindex only, deliberately no robots Disallow. -->
        <meta name="robots" content="noindex, follow" />
        <meta
            name="description"
            content="Kiosk-Ansicht der bitcircus101-Termine für den Bildschirm im Space."
        />
        <meta name="theme-color" content="#0a0a0a" />
        <script>
            /* Paint the chosen theme and palette BEFORE the first frame, so a
               wall that is pinned to ?palette=amber never flashes the default
               first. URL beats storage: the URL is how a screen is pinned.
               Deliberately duplicated from kiosk.js (which owns the real
               settings model) — this has to run before any external script. */
            try {
                var q = new URLSearchParams(location.search);
                var pick = function (name, key, allowed) {
                    var v = q.get(name) || localStorage.getItem(key);
                    return allowed.indexOf(v) > -1 ? v : allowed[0];
                };
                var root = document.documentElement;
                if (pick("theme", "bc.theme", ["dark", "light"]) === "light") {
                    root.dataset.theme = "light";
                }
                root.dataset.palette = pick("palette", "bc.kiosk.palette",
                    ["standard", "green", "amber", "mono", "pride"]);
            } catch (e) {}
        </script>
        <link rel="stylesheet" href="../style.css?v=8d454d1d" />
        <script defer src="../kiosk.js?v=8d454d1d"></script>
    </head>
    <body class="kiosk-body">
        <div class="kiosk">
            <header class="kiosk__top">
                <span class="kiosk__brand">bitcircus101</span>
                <span class="kiosk__path">/termine</span>
                <time class="kiosk__clock" id="kiosk-clock" aria-live="off"></time>
            </header>
            <main class="kiosk__list" id="kiosk-list" aria-busy="true">
                <noscript>
                    <p>JavaScript nötig — Termine unter bitcircus101.de/termine</p>
                </noscript>
            </main>
            <footer class="kiosk__bar">
                <span class="kiosk__status" id="kiosk-status"></span>
                <!-- Controls sit in the status bar and fade out with it while
                     nobody touches the screen: a wall display should show
                     events, not its own chrome. -->
                <div class="kiosk__controls">
                    <button
                        type="button"
                        class="kiosk__ctl"
                        id="kiosk-theme"
                        aria-pressed="false"
                        title="Invertieren (hell/dunkel)"
                    >
                        ◐<span class="sr-only">Helles Design umschalten</span>
                    </button>
                    <button
                        type="button"
                        class="kiosk__ctl"
                        id="kiosk-palette"
                        title="Nächste Farbe"
                    >
                        ◉<span class="sr-only">Farbe wechseln</span>
                    </button>
                    <button
                        type="button"
                        class="kiosk__ctl"
                        id="kiosk-settings-open"
                        aria-expanded="false"
                        aria-controls="kiosk-settings"
                        title="Einstellungen"
                    >
                        ⚙<span class="sr-only">Einstellungen öffnen</span>
                    </button>
                </div>
                <!-- Not a <dialog>: a wall browser may sit on an old engine, and a
                     panel that fails to open is worse than one that is always in
                     the DOM. Hidden via the attribute, per the no-inline-styles
                     rule. -->
                <section
                    class="kiosk-settings"
                    id="kiosk-settings"
                    aria-label="Einstellungen"
                    hidden
                >
                    <h1 class="kiosk-settings__title">[ einstellungen ]</h1>
                    <p class="kiosk-settings__hint" id="kiosk-settings-url"></p>

                    <fieldset class="kiosk-set">
                        <legend>Farbe</legend>
                        <div class="kiosk-set__row" id="kiosk-set-palette"></div>
                        <label class="kiosk-set__check">
                            <input type="checkbox" id="kiosk-set-cycle" />
                            automatisch wechseln (schützt vor Einbrennen)
                        </label>
                        <label class="kiosk-set__check">
                            <input type="checkbox" id="kiosk-set-light" />
                            helles Design
                        </label>
                    </fieldset>

                    <fieldset class="kiosk-set">
                        <legend>Anzeige</legend>
                        <label class="kiosk-set__field">
                            <span>Termine pro Seite (höchstens)</span>
                            <input
                                type="number"
                                id="kiosk-set-rows"
                                min="1"
                                max="12"
                                step="1"
                            />
                        </label>
                        <label class="kiosk-set__field">
                            <span>Blättern alle … Sekunden</span>
                            <input
                                type="number"
                                id="kiosk-set-dwell"
                                min="5"
                                max="300"
                                step="5"
                            />
                        </label>
                    </fieldset>

                    <fieldset class="kiosk-set">
                        <legend>Infotexte</legend>
                        <div class="kiosk-set__row" id="kiosk-set-info"></div>
                    </fieldset>

                    <fieldset class="kiosk-set">
                        <legend>Quellen</legend>
                        <div class="kiosk-set__row" id="kiosk-set-source"></div>
                    </fieldset>

                    <div class="kiosk-settings__actions">
                        <button type="button" class="kiosk-set__btn" id="kiosk-set-reset">
                            zurücksetzen
                        </button>
                        <button type="button" class="kiosk-set__btn" id="kiosk-settings-close">
                            schließen
                        </button>
                    </div>
                </section>
            </footer>
        </div>
    </body>
</html>
